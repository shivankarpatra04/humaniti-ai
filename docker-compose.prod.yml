# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Caddy is the only service reachable from outside; everything else talks over the compose network.
services:
  redis:
    ports: !reset []

  api:
    ports: !reset []
    environment:
      # Caddy serves the API under /api and strips the prefix; the report's player streams the video from here
      PUBLIC_API_URL: https://${DOMAIN:?set DOMAIN in .env}/api
      # tells FastAPI it is mounted under /api, so /api/docs loads its schema from /api/openapi.json
      UVICORN_ROOT_PATH: /api

  worker:
    # one RQ worker, one job at a time: Whisper already uses both vCPUs, so a second job would only slow both
    # a named volume keeps the Whisper model across rebuilds, so it downloads only once
    volumes: ["./data:/app/data", "whisper_models:/app/models"]

  frontend:
    ports: !reset []
    environment:
      DEMO_PASSWORD: ${DEMO_PASSWORD:?set DEMO_PASSWORD in .env}

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # holds the Let's Encrypt certificate; losing it means re-issuing and hitting rate limits
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, api]

volumes:
  whisper_models:
  caddy_data:
  caddy_config:
